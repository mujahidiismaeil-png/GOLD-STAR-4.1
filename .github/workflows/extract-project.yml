
name: Extract GOLD STAR Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          mkdir extracted
          unzip -q GOLD-STAR-4.1.zip -d extracted
          shopt -s dotglob
          entries=(extracted/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            cp -R "${entries[0]}"/. .
          else
            cp -R extracted/. .
          fi
          rm -rf extracted

      - name: Save extracted files
        run: |
          git config user.name "GOLD STAR Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract GOLD STAR 4.1 project"
          git push
